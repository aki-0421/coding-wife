name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NODE_VERSION: "22.12.0"

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.12.2
          run_install: false

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release tag and source branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/validate-release-tag.mjs --tag "$RELEASE_TAG"

      - name: Cache locked Cargo dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Activate pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch locked Apple Silicon Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Test macOS packaging boundary
        run: pnpm test:release

      - name: Build and verify ad-hoc signed DMG
        run: pnpm release:macos

      - name: Stage macOS release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source_dmg="$GITHUB_WORKSPACE/src-tauri/target/release/bundle/dmg/Coding-Wife.dmg"
          source_manifest="$source_dmg.release.json"
          test -f "$source_dmg" && test ! -L "$source_dmg"
          test -f "$source_manifest" && test ! -L "$source_manifest"

          release_dir="$RUNNER_TEMP/coding-wife-release-assets"
          mkdir -p "$release_dir"
          artifact_name="Coding-Wife-${RELEASE_TAG}-macOS-arm64.dmg"
          cp -p "$source_dmg" "$release_dir/$artifact_name"
          (
            cd "$release_dir"
            shasum -a 256 "$artifact_name" > "$artifact_name.sha256"
            shasum -a 256 --check "$artifact_name.sha256"
          )

      - name: Upload verified macOS assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: ${{ runner.temp }}/coding-wife-release-assets/*
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build Windows NSIS installer
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.12.2
          run_install: false

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release tag and source branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/validate-release-tag.mjs --tag "$env:RELEASE_TAG"

      - name: Cache locked Cargo dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Activate pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch locked Windows Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Check packaged legal inventory
        run: pnpm licenses:check:packaged

      - name: Build unsigned current-user NSIS installer
        run: pnpm exec tauri build --ci --bundles nsis

      - name: Install, inspect, and uninstall NSIS package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "$env:GITHUB_WORKSPACE/src-tauri/target/release/bundle/nsis/*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "WINDOWS_RELEASE_INSTALLER_SET_INVALID" }
          $installRoot = Join-Path $env:RUNNER_TEMP "coding-wife-nsis-smoke"
          if (Test-Path $installRoot) { throw "WINDOWS_RELEASE_INSTALL_ROOT_DIRTY" }

          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WINDOWS_RELEASE_INSTALL_FAILED" }
          $executable = Join-Path $installRoot "Coding Wife.exe"
          if (-not (Test-Path $executable -PathType Leaf)) { throw "WINDOWS_RELEASE_EXECUTABLE_MISSING" }
          $licenses = @(Get-ChildItem $installRoot -Recurse -File -Filter "CODING-WIFE-LICENSE.txt")
          if ($licenses.Count -ne 1) { throw "WINDOWS_RELEASE_LEGAL_RESOURCE_INVALID" }
          $uninstallers = @(Get-ChildItem $installRoot -File | Where-Object { $_.Name -match "uninstall.*\.exe" })
          if ($uninstallers.Count -ne 1) { throw "WINDOWS_RELEASE_UNINSTALLER_INVALID" }

          $uninstall = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "WINDOWS_RELEASE_UNINSTALL_FAILED" }
          for ($attempt = 0; $attempt -lt 40 -and (Test-Path $installRoot); $attempt++) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path $installRoot) { throw "WINDOWS_RELEASE_UNINSTALL_RESIDUE" }

      - name: Stage Windows release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $installers = @(Get-ChildItem "$env:GITHUB_WORKSPACE/src-tauri/target/release/bundle/nsis/*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "WINDOWS_RELEASE_INSTALLER_SET_INVALID" }
          $releaseDirectory = Join-Path $env:RUNNER_TEMP "coding-wife-release-assets"
          New-Item -ItemType Directory -Path $releaseDirectory | Out-Null
          $name = "Coding-Wife-$env:RELEASE_TAG-Windows-x64-setup.exe"
          $artifact = Join-Path $releaseDirectory $name
          Copy-Item $installers[0].FullName $artifact
          $checksum = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$artifact.sha256"
          [IO.File]::WriteAllText($checksumPath, "$checksum  $name`n", [Text.UTF8Encoding]::new($false))
          if ((Get-FileHash $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -ne $checksum) {
            throw "WINDOWS_RELEASE_CHECKSUM_MISMATCH"
          }

      - name: Upload verified Windows assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: ${{ runner.temp }}/coding-wife-release-assets/*
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.12.2
          run_install: false

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release tag and source branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/validate-release-tag.mjs --tag "$RELEASE_TAG"

      - name: Cache locked Cargo dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Activate pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch locked Linux Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Check packaged legal inventory
        run: pnpm licenses:check:packaged

      - name: Build Debian package and AppImage
        run: pnpm exec tauri build --ci --bundles deb,appimage

      - name: Install, inspect, and remove Debian package
        run: |
          mapfile -t packages < <(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/deb" -maxdepth 1 -type f -name '*.deb' -print)
          test "${#packages[@]}" -eq 1
          package_name="$(dpkg-deb -f "${packages[0]}" Package)"
          test -n "$package_name"
          sudo apt-get install -y "${packages[0]}"
          dpkg-query -W -f='${db:Status-Abbrev}' "$package_name" | grep -q '^ii'
          mapfile -t installed_files < <(dpkg-query -L "$package_name")
          executable="$(printf '%s\n' "${installed_files[@]}" | grep -E '/(usr/)?bin/coding-wife$')"
          test -n "$executable" && test -x "$executable"
          legal_resource="$(printf '%s\n' "${installed_files[@]}" | grep '/resources/legal/CODING-WIFE-LICENSE.txt$')"
          test -n "$legal_resource" && test -f "$legal_resource"
          sudo apt-get purge -y "$package_name"
          if dpkg-query -W "$package_name" >/dev/null 2>&1; then
            exit 1
          fi

      - name: Extract and inspect AppImage
        run: |
          mapfile -t appimages < <(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print)
          test "${#appimages[@]}" -eq 1
          chmod +x "${appimages[0]}"
          extract_root="$RUNNER_TEMP/coding-wife-appimage"
          mkdir -p "$extract_root"
          (
            cd "$extract_root"
            "${appimages[0]}" --appimage-extract >/dev/null
          )
          test -x "$extract_root/squashfs-root/AppRun"
          legal_resource="$(find "$extract_root/squashfs-root" -type f -path '*/resources/legal/CODING-WIFE-LICENSE.txt' -print -quit)"
          test -n "$legal_resource" && test -f "$legal_resource"

      - name: Stage Linux release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t packages < <(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/deb" -maxdepth 1 -type f -name '*.deb' -print)
          mapfile -t appimages < <(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' -print)
          test "${#packages[@]}" -eq 1 && test "${#appimages[@]}" -eq 1
          release_dir="$RUNNER_TEMP/coding-wife-release-assets"
          mkdir -p "$release_dir"
          deb_name="Coding-Wife-${RELEASE_TAG}-Linux-x64.deb"
          appimage_name="Coding-Wife-${RELEASE_TAG}-Linux-x64.AppImage"
          cp -p "${packages[0]}" "$release_dir/$deb_name"
          cp -p "${appimages[0]}" "$release_dir/$appimage_name"
          (
            cd "$release_dir"
            sha256sum "$deb_name" > "$deb_name.sha256"
            sha256sum "$appimage_name" > "$appimage_name.sha256"
            sha256sum --check "$deb_name.sha256" "$appimage_name.sha256"
          )

      - name: Upload verified Linux assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: ${{ runner.temp }}/coding-wife-release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Create draft release
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download all platform assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/coding-wife-release-assets

      - name: Verify exact release asset set and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/verify-release-assets.mjs --directory "$RUNNER_TEMP/coding-wife-release-assets" --tag "$RELEASE_TAG"

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_dir="$RUNNER_TEMP/coding-wife-release-assets"
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null)"; then
            is_draft="$(printf '%s' "$release_json" | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => process.stdout.write(String(JSON.parse(value).isDraft)))')"
            test "$is_draft" = "true"
            gh release upload "$RELEASE_TAG" --clobber "$release_dir"/*
          else
            notes_file="$RUNNER_TEMP/coding-wife-release-notes.md"
            cat > "$notes_file" <<'NOTES'
          ## Install / インストール

          ### macOS 14+ Apple Silicon

          Open the DMG, drag **Coding Wife.app** to **Applications**, and launch it there. This free build is ad-hoc signed but not Apple-notarized. If macOS blocks the first launch, try once, then use **System Settings > Privacy & Security > Open Anyway** for this app only.

          DMGを開き、**Coding Wife.app**を**Applications**へドラッグして起動します。この無料buildはad-hoc署名済みですがApple公証済みではありません。初回起動が拒否された場合は、一度起動を試した後、**システム設定 > プライバシーとセキュリティ > このまま開く**から、このアプリだけを許可してください。

          ### Windows 11 x64

          Download and run the `Windows-x64-setup.exe`. It installs for the current user without administrator rights. The installer is unsigned, so Microsoft Defender SmartScreen may warn. Verify this release and its SHA-256, then use **More info > Run anyway** for this installer only.

          `Windows-x64-setup.exe`をダウンロードして実行します。管理者権限なしのcurrent-user installです。未署名のためMicrosoft Defender SmartScreenが警告する場合があります。このreleaseとSHA-256を確認し、このinstallerに限って**詳細情報 > 実行**を選択してください。

          ### Ubuntu 22.04 / Debian 12 compatible x64 Linux

          Open the `.deb` with the system software installer. The AppImage is a portable fallback: make it executable and run it. Linux packages are unsigned; verify the matching SHA-256 sidecar first.

          `.deb`をOSのsoftware installerで開きます。AppImageはportable fallbackであり、実行bitを付けて起動します。Linux packageは未署名のため、先に対応するSHA-256 sidecarを確認してください。

          A compatible, authenticated local Codex installation is required for real GPT workflows on every platform. Do not disable Gatekeeper or SmartScreen globally. / すべてのplatformで実際のGPT workflowには、互換性があり認証済みのlocal Codexが必要です。GatekeeperやSmartScreenを全体無効化しないでください。
          NOTES
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "Coding Wife $RELEASE_TAG" \
              --notes-file "$notes_file" \
              "$release_dir"/*
          fi

          mapfile -t expected_assets < <(find "$release_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t published_assets < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          test "${#expected_assets[@]}" -eq 8
          test "${#published_assets[@]}" -eq 8
          diff -u <(printf '%s\n' "${expected_assets[@]}") <(printf '%s\n' "${published_assets[@]}")
