name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NODE_VERSION: "22.12.0"

jobs:
  release:
    name: Package and draft
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.12.2
          run_install: false

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release tag and source branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release/validate-release-tag.mjs --tag "$RELEASE_TAG"

      - name: Cache locked Cargo dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Activate pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch locked Apple Silicon Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Test macOS packaging boundary
        run: pnpm test:release

      - name: Build and verify ad-hoc signed DMG
        run: pnpm release:macos

      - name: Stage release assets
        id: assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source_dmg="$GITHUB_WORKSPACE/src-tauri/target/release/bundle/dmg/Coding-Wife.dmg"
          source_manifest="$source_dmg.release.json"
          test -f "$source_dmg" && test ! -L "$source_dmg"
          test -f "$source_manifest" && test ! -L "$source_manifest"

          release_dir="$RUNNER_TEMP/coding-wife-release-assets"
          mkdir -p "$release_dir"
          artifact_name="Coding-Wife-${RELEASE_TAG}-macOS-arm64.dmg"
          artifact_path="$release_dir/$artifact_name"
          checksum_path="$artifact_path.sha256"
          cp -p "$source_dmg" "$artifact_path"
          (
            cd "$release_dir"
            shasum -a 256 "$artifact_name" > "$artifact_name.sha256"
            shasum -a 256 --check "$artifact_name.sha256"
          )

          printf 'dmg=%s\nchecksum=%s\n' "$artifact_path" "$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_DMG: ${{ steps.assets.outputs.dmg }}
          RELEASE_CHECKSUM: ${{ steps.assets.outputs.checksum }}
        run: |
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null)"; then
            is_draft="$(printf '%s' "$release_json" | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => process.stdout.write(String(JSON.parse(value).isDraft)))')"
            test "$is_draft" = "true"
            gh release upload "$RELEASE_TAG" --clobber "$RELEASE_DMG" "$RELEASE_CHECKSUM"
          else
            notes_file="$RUNNER_TEMP/coding-wife-release-notes.md"
            cat > "$notes_file" <<'NOTES'
          ## Install / インストール

          1. Download and open the DMG. / DMGをダウンロードして開きます。
          2. Drag **Coding Wife.app** to **Applications**. / **Coding Wife.app**を**Applications**へドラッグします。
          3. Launch Coding Wife from Applications. / ApplicationsからCoding Wifeを起動します。

          This free build is ad-hoc signed and is not Apple-notarized. On first launch, macOS may block it. After trying to open it once, use **System Settings > Privacy & Security > Open Anyway**, then confirm **Open**. Do not disable Gatekeeper or remove quarantine attributes globally.

          この無料buildはad-hoc署名で、Apple公証済みではありません。初回起動をmacOSが拒否した場合は、一度起動を試した後、**システム設定 > プライバシーとセキュリティ > このまま開く**から許可し、**開く**を確認してください。Gatekeeperの無効化やquarantine属性の一括削除は行わないでください。

          Supported: macOS 14 or later on Apple Silicon. A compatible, authenticated local Codex installation is required for real GPT workflows.
          NOTES
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "Coding Wife $RELEASE_TAG" \
              --notes-file "$notes_file" \
              "$RELEASE_DMG" "$RELEASE_CHECKSUM"
          fi
