name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "22.12.0"

jobs:
  frontend:
    name: Frontend and repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.12.2
          run_install: false

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check Pull Request diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm check:diff -- --base "$BASE_SHA"

      - name: Check pushed commit range
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: pnpm check:diff -- --base "$BASE_SHA"

      - name: Check manually selected ref
        if: github.event_name == 'workflow_dispatch'
        run: pnpm check:diff

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Set up Go for agent-docs
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.4"
          cache: false

      - name: Install pinned agent-docs
        env:
          GOBIN: ${{ runner.temp }}/agent-docs-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/aki-0421/agent-docs/cmd/agent-docs@v0.1.1
          echo "$GOBIN" >> "$GITHUB_PATH"
          "$GOBIN/agent-docs" version

      - name: Lint managed documentation
        run: agent-docs --no-user-config lint

      - name: Lint frontend and repository scripts
        run: pnpm lint

      - name: Check TypeScript types
        run: pnpm typecheck

      - name: Run Pull Request test suite
        run: pnpm test

      - name: Build production frontend
        run: pnpm build

  native:
    name: Native
    needs: frontend
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.12.2
          run_install: false

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}

      - name: Activate pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch locked Apple Silicon Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Check locked dependency licenses
        run: pnpm licenses:check

      - name: Test dependency license inventory
        run: node --test scripts/licenses/*.test.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint native targets
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test native targets serially
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
