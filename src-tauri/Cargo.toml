[package]
name = "coding-wife"
version = "0.1.0"
description = "Evidence-centered Codex supervision with a Live2D companion"
authors = ["Coding Wife contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "coding_wife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
