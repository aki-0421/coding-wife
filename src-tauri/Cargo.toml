[package]
name = "coding-wife"
version = "0.1.0"
description = "Evidence-centered Codex supervision with a Live2D companion"
authors = ["Coding Wife contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "coding_wife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
hex = "=0.4.3"
libc = "=0.2.186"
regex = "=1.13.1"
rfd = { version = "=0.17.2", default-features = false }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
thiserror = "=1.0.69"
tokio = { version = "=1.53.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
