[package]
name = "coding-wife"
version = "0.1.3"
description = "Evidence-centered Codex supervision with a Live2D character"
authors = ["Coding Wife contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "coding_wife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
desktop-qa = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
hex = "=0.4.3"
libc = "=0.2.186"
png = "=0.18.1"
regex = "=1.13.1"
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-wdio = { version = "=1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.2.0", optional = true }
thiserror = "=1.0.69"
tokio = { version = "=1.53.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "=0.1.25"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
url = "=2.5.8"

[dev-dependencies]

[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
